<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/assets/favicon.png" type="image/x-icon">
    <title>StreamFlow - Initial Setup</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/setup.css">
</head>
<body>
    <div class="setup-container">
        <!-- Header -->
        <div class="setup-header">
            <div class="logo"><img src="/assets/favicon.png" alt="StreamFlow Logo" class="logo-img"></div>
            <h1>Welcome to StreamFlow</h1>
            <p>Let's set up your services</p>
        </div>

        <!-- Setup Form -->
        <form id="setupForm">
            <!-- TMDB Section -->
            <div class="section-title">
                <i class="fas fa-film"></i>
                TheMovieDB (TMDB) API
            </div>

            <div class="form-group">
                <label for="tmdbKey">
                    <i class="fas fa-key"></i> TMDB API Key
                </label>
                <input 
                    type="password" 
                    id="tmdbKey" 
                    name="tmdb_api_key" 
                    placeholder="Enter your TMDB API key"
                    required
                >
                <span class="hint">Get it from: <a href="https://www.themoviedb.org/settings/api" target="_blank" style="color: #3b82f6; text-decoration: none;">themoviedb.org/settings/api</a></span>
            </div>

            <!-- Jackett Section -->
            <div class="section-title">
                <i class="fas fa-search"></i>
                Jackett Configuration
            </div>

            <div class="form-group">
                <label for="jackettKey">
                    <i class="fas fa-key"></i> Jackett API Key
                </label>
                <input 
                    type="password" 
                    id="jackettKey" 
                    name="jackett_api_key" 
                    placeholder="Enter your Jackett API key"
                    required
                >
                <span class="hint">Found in Jackett dashboard</span>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="jackettIp">
                        <i class="fas fa-network-wired"></i> Jackett IP/Host
                    </label>
                    <input 
                        type="text" 
                        id="jackettIp" 
                        name="jackett_ip" 
                        placeholder="localhost"
                        value="localhost"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="jackettPort">
                        <i class="fas fa-plug"></i> Jackett Port
                    </label>
                    <input 
                        type="number" 
                        id="jackettPort" 
                        name="jackett_port" 
                        placeholder="9117"
                        value="9117"
                        required
                        min="1"
                        max="65535"
                    >
                </div>
            </div>

            <div class="test-group">
                <button type="button" class="btn-test" onclick="testJackett()">
                    <i class="fas fa-check-circle"></i> Test Jackett
                </button>
            </div>
            <div id="jackettStatus" class="status-message"></div>

            <!-- Advanced Settings -->
            <div class="advanced-toggle" onclick="toggleAdvanced()">
                <i class="fas fa-chevron-right"></i>
                <span>Advanced Settings</span>
            </div>

            <div class="advanced-section" id="advancedSection">
                <div class="form-group" style="margin-top: 20px;">
                    <label for="backendUrl">
                        <i class="fas fa-server"></i> Backend URL
                    </label>
                    <input 
                        type="url" 
                        id="backendUrl" 
                        name="backend_url" 
                        placeholder="Current URL (auto-detected)"
                        value=""
                    >
                    <span class="hint">URL where the backend server is running</span>
                </div>
            </div>

            <!-- Actions -->
            <div class="button-group">
                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="fas fa-check"></i> Complete Setup
                </button>
            </div>

            <div id="statusMessage" class="status-message"></div>
        </form>
    </div>

    <script src="js/setup.js"></script>
</body>
</html>
